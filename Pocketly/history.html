<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pocketly – Transaction History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#F8F5F0', sage: '#4A7C59',
            'sage-light': '#6B9E7B', 'sage-dark': '#2F5540', 'sage-muted': '#E8F0EB',
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>

  <div id="navbar" class="navbar"></div>

  <main class="page-wrapper">

    <!-- ── PAGE HEADER ──────────────────────── -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Transaction History</h1>
        <p class="text-sm text-gray-400 mt-0.5">Browse and filter all your transactions</p>
      </div>
      <a href="add-transaction.html" class="btn btn--primary">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
        Add
      </a>
    </div>

    <!-- ── CHARTS GRID ───────────────────────── -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">

      <!-- Bar chart: Income vs Expense last 6 months -->
      <div class="card rounded-2xl">
        <h2 class="section-title mb-4">Income vs Expenses (6 months)</h2>
        <div class="chart-wrap" style="height:220px">
          <canvas id="barChart"></canvas>
        </div>
      </div>

      <!-- Doughnut chart: Expense by category -->
      <div class="card rounded-2xl">
        <div class="flex items-center justify-between mb-4">
          <h2 class="section-title mb-0">Expenses by Category</h2>
          <span id="doughnutMonthLabel" class="text-xs text-gray-400"></span>
        </div>
        <div class="chart-wrap" style="height:220px">
          <canvas id="doughnutChart"></canvas>
        </div>
        <!-- Legend generated by JS -->
        <div id="doughnutLegend" class="mt-3 grid grid-cols-2 gap-x-4 gap-y-1"></div>
      </div>
    </div>

    <!-- ── MONTH NAVIGATOR ───────────────────── -->
    <div class="card rounded-2xl mb-6">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">

        <!-- Month selector -->
        <div class="flex items-center gap-3">
          <button id="prevMonth" class="month-nav-btn" aria-label="Previous month">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
            </svg>
          </button>
          <span id="monthLabel" class="month-label"></span>
          <button id="nextMonth" class="month-nav-btn" aria-label="Next month">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
        </div>

        <!-- Monthly stats -->
        <div class="flex gap-4 text-sm">
          <div>
            <span class="text-gray-400 block text-xs uppercase tracking-wide">Income</span>
            <span id="monthStatIncome" class="font-bold" style="color:var(--income)">Rp0</span>
          </div>
          <div>
            <span class="text-gray-400 block text-xs uppercase tracking-wide">Expenses</span>
            <span id="monthStatExpenses" class="font-bold" style="color:var(--expense)">Rp0</span>
          </div>
          <div>
            <span class="text-gray-400 block text-xs uppercase tracking-wide">Net</span>
            <span id="monthStatNet" class="font-bold text-gray-700">Rp0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ── FILTERS & SEARCH ──────────────────── -->
    <div class="card rounded-2xl mb-6">
      <div class="flex flex-col sm:flex-row gap-3">

        <!-- Type filter -->
        <div class="flex gap-2" role="group" aria-label="Type filter">
          <button class="filter-tab active" data-filter="all">All</button>
          <button class="filter-tab" data-filter="income">Income</button>
          <button class="filter-tab" data-filter="expense">Expense</button>
        </div>

        <!-- Category filter -->
        <select id="categoryFilter" class="form-control form-control--select text-sm" style="max-width:180px">
          <option value="">All Categories</option>
        </select>

        <!-- Search -->
        <div class="relative flex-1">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="m21 21-4.35-4.35"/>
          </svg>
          <input id="searchInput" type="text" placeholder="Search by name…"
            class="form-control pl-9 rounded-full text-sm" />
        </div>
      </div>
    </div>

    <!-- ── TRANSACTION LIST ──────────────────── -->
    <section aria-label="Transaction list">
      <div id="historyList" class="space-y-3"></div>
      <div id="emptyState" class="empty-state hidden">
        <svg class="w-12 h-12 text-gray-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-3-3v6M3 12a9 9 0 1118 0A9 9 0 013 12z"/>
        </svg>
        <p class="text-sm font-medium mt-2">No transactions found for this period.</p>
        <p class="text-xs mt-1">Try changing the month or clearing filters.</p>
      </div>
    </section>

  </main>

  <script src="storage.js"></script>
  <script src="components.js"></script>
  <script src="chat.js"></script>
  <script src="history.js"></script>
  <script>document.addEventListener('DOMContentLoaded', initChat);</script>
</body>
</html>
